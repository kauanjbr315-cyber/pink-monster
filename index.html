<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pink Monster - Mobile</title>
    <style>
        body { margin: 0; padding: 0; background: #222; overflow: hidden; touch-action: none; font-family: sans-serif; user-select: none; -webkit-user-select: none; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; object-fit: contain; background: #1e461e; }
        
        /* Tela de Início Overlay */
        #telaInicial { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #142814; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
        .btn-iniciar { padding: 20px 40px; background: #2e662e; border-radius: 10px; font-size: 24px; font-weight: bold; border: 2px solid white; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.5); animation: pulsar 1.5s infinite; cursor: pointer; }
        @keyframes pulsar { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* Controles Mobile */
        .controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; box-sizing: border-box; pointer-events: none; }
        
        /* Joystick HUD */
        .joystick-container { position: relative; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; pointer-events: auto; display: flex; justify-content: center; align-items: center; border: 2px solid rgba(255, 255, 255, 0.5); }
        .joystick-knob { width: 50px; height: 50px; background: rgba(255, 255, 255, 0.7); border-radius: 50%; position: absolute; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }

        /* Botões de Ação */
        .actions { display: flex; align-items: flex-end; justify-content: flex-end; position: relative; width: 140px; height: 120px; pointer-events: auto;}
        .btn { border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px; user-select: none; color: white; border: 2px solid rgba(255, 255, 255, 0.5); text-shadow: 1px 1px 2px black;}
        .btn:active { transform: scale(0.9); }
        .btn-jump { position: absolute; top: 0px; right: 80px; width: 60px; height: 60px; background: rgba(100, 200, 255, 0.5); }
        .btn-attack { position: absolute; bottom: 0px; right: 0px; width: 70px; height: 70px; background: rgba(255, 100, 100, 0.5); }
    </style>
</head>
<body>

<div id="telaInicial">
    <h1 style="color: gold; font-size: 50px; margin-bottom: 20px; text-align: center;">Pink Monster</h1>
    <div class="btn-iniciar" id="btnComecar">TOQUE AQUI PARA<br>COMEÇAR A JOGAR</div>
</div>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<div class="controls">
    <div class="joystick-container" id="joystickBase">
        <div class="joystick-knob" id="joystickKnob"></div>
    </div>
    <div class="actions">
        <div class="btn btn-jump" id="btnSpace">Pular</div>
        <div class="btn btn-attack" id="btnJ">Soco</div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const imagens = {};
    function carregarImagem(nome, src) {
        imagens[nome] = { img: new Image(), carregada: false };
        imagens[nome].img.onload = () => { imagens[nome].carregada = true; };
        imagens[nome].img.src = src;
    }

    carregarImagem('heroi_parado', 'Pink_Monster.png');
    carregarImagem('inimigo', 'Rock1.png');
    carregarImagem('bau', 'pngwing.com.png');
    carregarImagem('obstaculo', 'Rock2.png');
    carregarImagem('cenario', 'cenario.jpg');
    carregarImagem('andar', 'Pink_Monster_Walk_6.png');
    carregarImagem('ataque', 'Pink_Monster_Attack1_4.png');
    carregarImagem('morte', 'Pink_Monster_Death_8.png');
    carregarImagem('pulo', 'Pink_Monster_Jump_8.png');
    carregarImagem('moeda', 'coin1_16x16.png');

    const sons = {
        moeda: new Audio('moeda.wav'),
        soco: new Audio('soco.wav'),
        gameover: new Audio('gameover.wav'),
        fundo: new Audio('Quem leu se fudeu.mp3') 
    };
    
    sons.fundo.loop = true; 
    sons.fundo.volume = 0.4; 

    function tocarSom(nomeSom) {
        if (sons[nomeSom]) {
            sons[nomeSom].currentTime = 0;
            sons[nomeSom].play().catch(() => {});
        }
    }

    // ==========================================
    // MÁGICA DA TELA INICIAL (USANDO O EVENTO CLIQUE CORRETO)
    // ==========================================
    const telaInicial = document.getElementById("telaInicial");
    const btnComecar = document.getElementById("btnComecar");

    // O evento 'click' é a única coisa que os navegadores mobile confiam a 100%
    btnComecar.addEventListener('click', function() {
        telaInicial.style.display = "none"; 

        // 1. TOCA A MÚSICA DIRETAMENTE AQUI NO CLIQUE!
        sons.fundo.currentTime = 0;
        let playPromise = sons.fundo.play();
        if (playPromise !== undefined) {
            playPromise.catch(e => console.log("Erro de áudio:", e));
        }

        // 2. Desbloqueia os outros efeitos
        sons.moeda.play().then(() => sons.moeda.pause()).catch(()=>{});
        sons.soco.play().then(() => sons.soco.pause()).catch(()=>{});
        sons.gameover.play().then(() => sons.gameover.pause()).catch(()=>{});

        // 3. Arranca o jogo
        iniciarJogo();
    });

    // ==========================================
    // 2. INPUTS (Joystick e Botões)
    // ==========================================
    const keys = { space: false, j: false };
    
    function bindButton(id, keyName) {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
    }
    bindButton('btnSpace', 'space'); 
    bindButton('btnJ', 'j');

    const joyBase = document.getElementById("joystickBase");
    const joyKnob = document.getElementById("joystickKnob");
    let joyAxis = { x: 0, y: 0 }; 
    let joyAtivo = false;
    const raioMaximo = 40; 

    function atualizarJoystick(e) {
        e.preventDefault();
        let touch = e.targetTouches[0];
        let rect = joyBase.getBoundingClientRect();
        let centroX = rect.left + rect.width / 2;
        let centroY = rect.top + rect.height / 2;
        let dx = touch.clientX - centroX;
        let dy = touch.clientY - centroY;
        let distancia = Math.sqrt(dx * dx + dy * dy);
        
        if (distancia > raioMaximo) { dx = (dx / distancia) * raioMaximo; dy = (dy / distancia) * raioMaximo; }
        joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        joyAxis.x = dx / raioMaximo;
        joyAxis.y = dy / raioMaximo;
    }

    joyBase.addEventListener('touchstart', (e) => { joyAtivo = true; atualizarJoystick(e); }, {passive: false});
    joyBase.addEventListener('touchmove', (e) => { if(joyAtivo) atualizarJoystick(e); }, {passive: false});
    joyBase.addEventListener('touchend', (e) => { joyAtivo = false; joyAxis = {x: 0, y: 0}; joyKnob.style.transform = `translate(0px, 0px)`; });

    canvas.addEventListener('touchstart', (e) => {
        if(estadoJogo === "GAME_OVER") {
            iniciarJogo();
            // Toca a música novamente se recomeçar
            sons.fundo.currentTime = 0;
            sons.fundo.play().catch(()=>{});
        }
    });

    // ==========================================
    // 3. VARIÁVEIS E LÓGICA DE JOGO
    // ==========================================
    let estadoJogo = "MENU"; 
    let vidas = 3;
    let pontos = 0;
    let nivel = 1;
    let invencivelTimer = 0;
    
    let jogador = { 
        x: 400, y: 300, size: 40, speed: 5, 
        z: 0, velZ: 0, pulando: false, atacando: false, andando: false, viradoDireita: true,
        frameAndar: 0, frameAtaque: 0, framePulo: 0, frameMorte: 0 
    };
    let inimigo = { x: 100, y: 100, size: 40, speed: 1.5 };
    let moeda = { x: 0, y: 0, size: 20, frame: 0 };
    let bau = { x: 380, y: 50, size: 40, visivel: false };
    
    const gravidade = 0.8;
    const forcaPulo = 12;

    const obstaculos = [
        {x: 200, y: 100, w: 40, h: 40}, {x: 200, y: 140, w: 40, h: 40}, {x: 200, y: 180, w: 40, h: 40},
        {x: 500, y: 400, w: 40, h: 40}, {x: 540, y: 400, w: 40, h: 40}, {x: 580, y: 400, w: 40, h: 40},
        {x: 400, y: 150, w: 40, h: 40}, {x: 400, y: 190, w: 40, h: 40}, {x: 650, y: 150, w: 40, h: 40}, {x: 100, y: 450, w: 40, h: 40}
    ];

    function retIntersect(r1, r2) {
        return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
    }

    function gerarMoeda() {
        let colisao = true;
        while(colisao) {
            moeda.x = Math.random() * (800 - moeda.size);
            moeda.y = Math.random() * (600 - moeda.size);
            colisao = obstaculos.some(obs => retIntersect({x: moeda.x, y: moeda.y, w: moeda.size, h: moeda.size}, obs));
        }
    }
    gerarMoeda();

    function iniciarJogo() {
        estadoJogo = "JOGANDO";
        jogador.x = 400; jogador.y = 300; jogador.z = 0; jogador.pulando = false; jogador.viradoDireita = true;
        jogador.frameMorte = 0;
        inimigo.x = 100; inimigo.y = 100; inimigo.speed = 1.5;
        pontos = 0; nivel = 1; vidas = 3; bau.visivel = false;
        gerarMoeda();
    }

    function update() {
        moeda.frame += 0.2; 

        if (estadoJogo === "MORRENDO") {
            jogador.frameMorte += 0.15;
            if (jogador.frameMorte >= 8) {
                estadoJogo = "GAME_OVER";
                tocarSom('gameover');
            }
            return;
        }

        if (estadoJogo !== "JOGANDO") return;

        if (keys.j && !jogador.atacando && !jogador.pulando) {
            jogador.atacando = true;
            jogador.frameAtaque = 0;
            tocarSom('soco');
            
            let zonaAtaque = {x: jogador.x - 30, y: jogador.y - 30, w: jogador.size + 60, h: jogador.size + 60};
            if (retIntersect(zonaAtaque, {x: inimigo.x, y: inimigo.y, w: inimigo.size, h: inimigo.size})) {
                inimigo.x = 100; inimigo.y = 100;
            }
        }

        if (keys.space && !jogador.pulando && !jogador.atacando) {
            jogador.pulando = true;
            jogador.velZ = forcaPulo;
            jogador.framePulo = 0;
        }

        let velX = 0, velY = 0;
        jogador.andando = false;

        if (!jogador.atacando) {
            velX = joyAxis.x * jogador.speed;
            velY = joyAxis.y * jogador.speed;
            if (Math.abs(velX) > 0.1 || Math.abs(velY) > 0.1) jogador.andando = true;
            if (velX > 0.1) jogador.viradoDireita = true;
            else if (velX < -0.1) jogador.viradoDireita = false;
        }

        if (jogador.pulando) {
            jogador.z += jogador.velZ;
            jogador.velZ -= gravidade;
            jogador.framePulo += 0.25;
            if (jogador.framePulo >= 8) jogador.framePulo = 7;
            if (jogador.z <= 0) { jogador.z = 0; jogador.pulando = false; }
        } else if (jogador.atacando) {
            jogador.frameAtaque += 0.3;
            if (jogador.frameAtaque >= 4) jogador.atacando = false;
        } else if (jogador.andando) {
            jogador.frameAndar += Math.max(0.15, Math.abs(joyAxis.x) * 0.3 + Math.abs(joyAxis.y) * 0.3); 
            if (jogador.frameAndar >= 6) jogador.frameAndar = 0;
        }

        jogador.x += velX;
        let retX = {x: jogador.x, y: jogador.y, w: jogador.size, h: jogador.size};
        if (!jogador.pulando && obstaculos.some(obs => retIntersect(retX, obs))) jogador.x -= velX;
        jogador.x = Math.max(0, Math.min(jogador.x, 800 - jogador.size));

        jogador.y += velY;
        let retY = {x: jogador.x, y: jogador.y, w: jogador.size, h: jogador.size};
        if (!jogador.pulando && obstaculos.some(obs => retIntersect(retY, obs))) jogador.y -= velY;
        jogador.y = Math.max(0, Math.min(jogador.y, 600 - jogador.size));

        let velArmadilhaX = 0, velArmadilhaY = 0;
        if (inimigo.x < jogador.x) velArmadilhaX = inimigo.speed; else if (inimigo.x > jogador.x) velArmadilhaX = -inimigo.speed;
        if (inimigo.y < jogador.y) velArmadilhaY = inimigo.speed; else if (inimigo.y > jogador.y) velArmadilhaY = -inimigo.speed;
        
        inimigo.x += velArmadilhaX;
        if (obstaculos.some(obs => retIntersect({x: inimigo.x, y: inimigo.y, w: inimigo.size, h: inimigo.size}, obs))) inimigo.x -= velArmadilhaX;
        inimigo.y += velArmadilhaY;
        if (obstaculos.some(obs => retIntersect({x: inimigo.x, y: inimigo.y, w: inimigo.size, h: inimigo.size}, obs))) inimigo.y -= velArmadilhaY;

        let retJogador = {x: jogador.x, y: jogador.y, w: jogador.size, h: jogador.size};
        let retMoeda = {x: moeda.x, y: moeda.y, w: moeda.size, h: moeda.size};
        let retInimigo = {x: inimigo.x, y: inimigo.y, w: inimigo.size, h: inimigo.size};
        let retBau = {x: bau.x, y: bau.y, w: bau.size, h: bau.size};

        if (!jogador.pulando && retIntersect(retJogador, retMoeda)) {
            tocarSom('moeda'); pontos += 10; gerarMoeda();
            if (pontos >= 50) bau.visivel = true;
        }

        if (!jogador.pulando && bau.visivel && retIntersect(retJogador, retBau)) {
            nivel++; pontos = 0; bau.visivel = false; inimigo.speed += 0.5;
            jogador.x = 400; jogador.y = 300; inimigo.x = 100; inimigo.y = 100;
        }

        if (invencivelTimer > 0) invencivelTimer--;
        if (!jogador.pulando && !jogador.atacando && invencivelTimer <= 0 && retIntersect(retJogador, retInimigo)) {
            tocarSom('soco');
            vidas--;
            invencivelTimer = 90;
            if (vidas <= 0) {
                estadoJogo = "MORRENDO";
                sons.fundo.pause(); 
            }
        }
    }

    function desenharSprite(imgObj, framesTotais, frameAtual, dx, dy, dw, dh, viradoDireita = true) {
        if (!imgObj || !imgObj.carregada) return false;
        const sw = imgObj.img.width / framesTotais; const sh = imgObj.img.height; const sx = Math.floor(frameAtual) * sw;
        ctx.save();
        if (!viradoDireita) { ctx.translate(dx + dw, dy); ctx.scale(-1, 1); ctx.drawImage(imgObj.img, sx, 0, sw, sh, 0, 0, dw, dh); } 
        else { ctx.drawImage(imgObj.img, sx, 0, sw, sh, dx, dy, dw, dh); }
        ctx.restore();
        return true;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (imagens['cenario'].carregada) ctx.drawImage(imagens['cenario'].img, 0, 0, canvas.width, canvas.height);
        else { ctx.fillStyle = "#1e461e"; ctx.fillRect(0, 0, canvas.width, canvas.height); }

        if (estadoJogo === "JOGANDO" || estadoJogo === "MORRENDO" || estadoJogo === "GAME_OVER") {
            obstaculos.forEach(obs => {
                if (imagens['obstaculo'].carregada) ctx.drawImage(imagens['obstaculo'].img, obs.x, obs.y, obs.w, obs.h);
                else { ctx.fillStyle = "gray"; ctx.fillRect(obs.x, obs.y, obs.w, obs.h); }
            });

            let desenhouMoeda = desenharSprite(imagens['moeda'], Math.max(1, imagens['moeda'].img.width / imagens['moeda'].img.height || 4), moeda.frame % 4, moeda.x, moeda.y, moeda.size, moeda.size);
            if (!desenhouMoeda) { ctx.fillStyle = "gold"; ctx.beginPath(); ctx.arc(moeda.x + 10, moeda.y + 10, 10, 0, Math.PI*2); ctx.fill(); }

            if (bau.visivel) {
                if (imagens['bau'].carregada) ctx.drawImage(imagens['bau'].img, bau.x, bau.y, bau.size, bau.size);
                else { ctx.fillStyle = "#8b4513"; ctx.fillRect(bau.x, bau.y, bau.size, bau.size); }
            }

            if (imagens['inimigo'].carregada) ctx.drawImage(imagens['inimigo'].img, inimigo.x, inimigo.y, inimigo.size, inimigo.size);
            else { ctx.fillStyle = "red"; ctx.fillRect(inimigo.x, inimigo.y, inimigo.size, inimigo.size); }

            let mostrarJogador = true;
            if (invencivelTimer > 0 && Math.floor(invencivelTimer / 10) % 2 === 0) mostrarJogador = false;

            if (mostrarJogador) {
                if (jogador.pulando) {
                    ctx.fillStyle = "rgba(0,0,0,0.4)";
                    ctx.beginPath(); ctx.ellipse(jogador.x + 20, jogador.y + 35, 20, 5, 0, 0, Math.PI*2); ctx.fill();
                }

                let yDesenho = jogador.y - jogador.z;
                let desenhouHeroi = false;

                if (estadoJogo === "MORRENDO") { desenhouHeroi = desenharSprite(imagens['morte'], 8, Math.min(7, jogador.frameMorte), jogador.x, yDesenho, jogador.size, jogador.size, jogador.viradoDireita); } 
                else if (estadoJogo === "GAME_OVER") { desenhouHeroi = desenharSprite(imagens['morte'], 8, 7, jogador.x, yDesenho, jogador.size, jogador.size, jogador.viradoDireita); } 
                else if (jogador.pulando) {
                    if (imagens['pulo'].carregada) desenhouHeroi = desenharSprite(imagens['pulo'], 8, jogador.framePulo, jogador.x, yDesenho, jogador.size, jogador.size, jogador.viradoDireita);
                    else desenhouHeroi = desenharSprite(imagens['andar'], 6, jogador.frameAndar, jogador.x, yDesenho, jogador.size, jogador.size, jogador.viradoDireita);
                } else if (jogador.atacando) { desenhouHeroi = desenharSprite(imagens['ataque'], 4, jogador.frameAtaque, jogador.x, yDesenho, jogador.size, jogador.size, jogador.viradoDireita); } 
                else if (jogador.andando) { desenhouHeroi = desenharSprite(imagens['andar'], 6, jogador.frameAndar, jogador.x, yDesenho, jogador.size, jogador.size, jogador.viradoDireita); } 
                else {
                    if (imagens['heroi_parado'].carregada) {
                        ctx.save();
                        if (!jogador.viradoDireita) { ctx.translate(jogador.x + jogador.size, yDesenho); ctx.scale(-1, 1); ctx.drawImage(imagens['heroi_parado'].img, 0, 0, jogador.size, jogador.size); } 
                        else ctx.drawImage(imagens['heroi_parado'].img, jogador.x, yDesenho, jogador.size, jogador.size);
                        ctx.restore();
                        desenhouHeroi = true;
                    }
                }

                if (!desenhouHeroi) { ctx.fillStyle = (jogador.atacando) ? "purple" : "pink"; ctx.fillRect(jogador.x, yDesenho, jogador.size, jogador.size); }
            }

            ctx.fillStyle = "white"; ctx.font = "24px sans-serif";
            ctx.fillText(`Pontos: ${pontos}`, 10, 30);
            ctx.fillText(`Nível: ${nivel}`, 700, 30);
            ctx.fillStyle = "red";
            for(let i=0; i<vidas; i++) { ctx.beginPath(); ctx.arc(30 + i*30, 60, 10, 0, Math.PI*2); ctx.fill(); }

            if (estadoJogo === "GAME_OVER") {
                ctx.fillStyle = "rgba(50, 0, 0, 0.7)"; ctx.fillRect(0,0,800,600);
                ctx.fillStyle = "red"; ctx.font = "80px sans-serif"; ctx.fillText("GAME OVER", 200, 300);
                ctx.fillStyle = "white"; ctx.font = "30px sans-serif"; ctx.fillText("Toque na tela para recomeçar", 220, 400);
            }
        }
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
</script>
</body>
</html>
